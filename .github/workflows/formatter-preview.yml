name: Preview Ruff formatting patch
on:
  push:
    paths: [".github/workflows/formatter-preview.yml"]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.0
      - name: Preview exact formatter result
        run: |
          ruff format .
          echo "FORMAT_PATCH_BEGIN"
          git diff -- . ':!.github/workflows/formatter-preview.yml'
          echo "FORMAT_PATCH_END"
